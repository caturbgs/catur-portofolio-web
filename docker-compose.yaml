services:
  catur-portofolio-web:
    container_name: catur-portofolio-web
    image: ghcr.io/caturbgs/catur-portofolio-web:latest
    env_file:
      - path: .env
        required: false
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
      - /app/.data
    ports:
      - "3000:3000"
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
        reservations:
          cpus: "0.25"
          memory: 128M
